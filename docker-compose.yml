services:
  postgres:
    image: postgres:17-alpine
    # Comes back on its own after a reboot. Without this the container stays
    # stopped, the app cannot connect, and it looks like the data is gone.
    restart: unless-stopped
    environment:
      POSTGRES_DB: canvas
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - canvas-postgres:/var/lib/postgresql/data

volumes:
  canvas-postgres:

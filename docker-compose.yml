services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: canvas
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - canvas-postgres:/var/lib/postgresql/data

volumes:
  canvas-postgres:
